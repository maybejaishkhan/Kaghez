name: macOS

# macOS CI for Kaori: freeze with PyInstaller and ship .app + .dmg bundles
# (arm64 + x86_64) with a bundled Temurin JRE. See CI.md for the running notes.

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  PYTHONUNBUFFERED: "1"
  JRE_MAJOR: "21"

jobs:
  package:
    name: Package .app / .dmg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      # One arch failing shouldn't cancel the other.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon
            arch: arm64
            jre_arch: aarch64
          - runner: macos-15-intel    # Intel (x86_64); last Intel image, EOL ~Aug 2027
            arch: x86_64
            jre_arch: x64
    env:
      # Adoptium's arch names differ from ours: arm64 -> aarch64, x86_64 -> x64.
      # ARCH is what we use for artifact/dmg naming.
      ARCH: ${{ matrix.arch }}
      JRE_ARCH: ${{ matrix.jre_arch }}
    steps:
      # The Suwayomi jar is stored in Git LFS. Without lfs: true the bundle
      # would ship the ~130 byte pointer file and the local server can't start.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check the server jar
        run: |
          jar=$(ls src/Suwayomi-Server-*.jar)
          size=$(stat -f %z "$jar")
          echo "$jar: $size bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "$jar is a Git LFS pointer, not the real jar" >&2
            exit 1
          fi

      # Note: PATH/GITHUB_ENV additions here only take effect in later steps,
      # which is fine -- gettext (msgfmt) is first used by "Build resources".
      - name: Install dependencies
        run: |
          brew install \
            gtk4 libadwaita pygobject3 \
            blueprint-compiler meson ninja \
            gettext pkg-config librsvg \
            adwaita-icon-theme gsettings-desktop-schemas \
            gobject-introspection
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          # NOTE: do NOT export GI_TYPELIB_PATH here. PyInstaller's macOS typelib
          # collector derives the share/gir-1.0 dir from the *typelib path*; a
          # keg-path (brew --prefix gtk4/...) makes it look in
          # /opt/homebrew/opt/share/gir-1.0 and drop Gtk/Adw with "Unable to find
          # gir directory". The default search path (/opt/homebrew/lib/...) works.
          #
          # `gi` itself comes from Homebrew's pygobject3, so it isn't pip-installed
          # here. --ignore-installed makes pip lay down fresh copies instead of
          # trying to uninstall brew-owned packages (e.g. typing_extensions has no
          # RECORD file, which makes pip abort with uninstall-no-record-file).
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages --ignore-installed \
            pyinstaller httpx diskcache babel \
            "gql[aiohttp,websockets,httpx]"

      - name: Build resources
        run: |
          meson setup build
          meson compile -C build
          gresource=$(find build -name kaori.gresource | head -1)
          echo "gresource: $gresource"
          test -n "$gresource"
          echo "KAORI_GRESOURCE=$PWD/$gresource" >> "$GITHUB_ENV"

      # Cheap early failure: confirm the package imports before we spend
      # minutes freezing it with PyInstaller.
      - name: Import check
        run: |
          mkdir -p smoke
          ln -sfn "$PWD/src" smoke/kaori
          PYTHONPATH="$PWD/smoke" python3 - <<'PY'
          import os
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Gio

          resource = os.environ["KAORI_GRESOURCE"]
          Gio.Resource.load(resource)._register()
          print("registered", resource)

          import kaori.main  # noqa: F401
          print("imported kaori.main")
          PY

      - name: Prepare metadata
        run: |
          version=$(sed -n "s/^[[:space:]]*version:[[:space:]]*'\([^']*\)'.*/\1/p" meson.build | head -1)
          echo "KAORI_VERSION=$version" >> "$GITHUB_ENV"
          echo "version: $version"

          mkdir -p build/schemas build/locale
          cp data/io.github.riyaniii.Kaori.gschema.xml build/schemas/
          glib-compile-schemas build/schemas
          # po/ currently has no .po files (LINGUAS is empty), so only run
          # msgfmt when there is actually something to translate.
          shopt -s nullglob
          pos=(po/*.po)
          if [ ${#pos[@]} -gt 0 ]; then
            for po in "${pos[@]}"; do
              lang=$(basename "$po" .po)
              mkdir -p "build/locale/$lang/LC_MESSAGES"
              msgfmt -o "build/locale/$lang/LC_MESSAGES/kaori.mo" "$po"
            done
          else
            echo "no .po files found; skipping locales"
          fi
          echo "$KAORI_VERSION" > build/version
          echo "schemas:" && ls build/schemas
          echo "locales:" && ls -R build/locale

      - name: Fetch the JRE and app icon
        run: |
          curl -fsSL \
            "https://api.adoptium.net/v3/binary/latest/${JRE_MAJOR}/ga/mac/${JRE_ARCH}/jre/hotspot/normal/eclipse" \
            -o "$RUNNER_TEMP/jre.tar.gz"
          mkdir -p "$RUNNER_TEMP/jre"
          tar -xzf "$RUNNER_TEMP/jre.tar.gz" -C "$RUNNER_TEMP/jre"
          home=$(find "$RUNNER_TEMP/jre" -type d -path '*/Contents/Home' | head -1)
          echo "JRE_HOME=$home" >> "$GITHUB_ENV"
          "$home/bin/java" -version

          rsvg-convert -w 1024 -h 1024 \
            data/icons/hicolor/scalable/apps/io.github.riyaniii.Kaori.svg \
            -o build/icon.png
          rm -rf build/Kaori.iconset
          mkdir -p build/Kaori.iconset
          for s in 16 32 128 256 512; do
            sips -z "$s" "$s" build/icon.png --out "build/Kaori.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z "$d" "$d" build/icon.png --out "build/Kaori.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns build/Kaori.iconset -o build/Kaori.icns
          ls -lh build/Kaori.icns

      - name: Freeze the app with PyInstaller
        env:
          KAORI_ROOT: ${{ github.workspace }}
        run: |
          mkdir -p build/pypkg
          ln -sfn "$PWD/src" build/pypkg/kaori
          python3 -m PyInstaller --clean --noconfirm \
            --workpath build/pyinstaller --distpath dist mac/kaori.spec
          rm -rf build/pypkg

          # Fail loudly if Gtk/Adw typelibs did not make it into the bundle.
          # Missing them is the cause of "Namespace Gtk not available" at launch.
          for tl in Gtk-4.0.typelib Adw-1.typelib; do
            if ! find dist/Kaori -iname "$tl" | grep -q .; then
              echo "ERROR: $tl missing from the bundle" >&2
              find dist/Kaori -iname '*.typelib' | sort >&2
              exit 1
            fi
          done
          echo "typelibs:" && find dist/Kaori -iname '*.typelib' | sort

          # Bundle the JRE next to the frozen app so Suwayomi can start.
          mkdir -p dist/Kaori/_internal/jre
          cp -R "$JRE_HOME/." dist/Kaori/_internal/jre/
          dist/Kaori/_internal/jre/bin/java -version
          echo "dist:" && ls -la dist/Kaori | head

      - name: Assemble and sign the .app
        run: |
          app="Kaori.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R dist/Kaori/. "$app/Contents/Resources/"
          swiftc mac/launch-kaori.swift -o "$app/Contents/MacOS/Kaori"
          cp build/Kaori.icns "$app/Contents/Resources/Kaori.icns"
          sed "s/@VERSION@/$KAORI_VERSION/g" mac/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"

          # Sign PyInstaller's binaries, but leave the bundled Temurin JRE alone:
          # Adoptium already signs it with the JVM entitlements, and re-signing it
          # ad-hoc strips those and can stop `java` from running.
          find "$app" -type f -not -path "*/jre/*" \
            -exec sh -c 'file "$1" | grep -q "Mach-O" && codesign -f -s - "$1"' _ {} \; 2>/dev/null || true
          codesign -f -s - "$app"
          codesign --verify --verbose=2 "$app"
          # The bundled JRE must still run after packaging.
          "$app/Contents/Resources/_internal/jre/bin/java" -version
          echo "bundle:" && find "$app" -maxdepth 3 -type d | head -20

      - name: Create the .dmg
        run: |
          hdiutil create -volname Kaori -srcfolder Kaori.app -ov -format UDZO \
            "Kaori-${KAORI_VERSION}-${ARCH}.dmg"
          ls -lh ./*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Kaori-macOS-${{ env.ARCH }}
          path: Kaori-*-${{ env.ARCH }}.dmg
          compression-level: 0

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Kaori-*-${{ env.ARCH }}.dmg
