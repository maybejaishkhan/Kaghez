name: macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref (saves macOS minutes)
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build & validate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # The Suwayomi jar is stored in Git LFS. Without lfs: true the build
      # would validate the ~130 byte pointer file instead of the real jar.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check the server jar
        run: |
          jar=$(ls src/Suwayomi-Server-*.jar)
          size=$(stat -f %z "$jar")
          echo "$jar: $size bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "$jar is a Git LFS pointer, not the real jar" >&2
            exit 1
          fi

      # desktop-file-utils provides update-desktop-database, which the
      # meson post-install hook runs during `meson install`.
      - name: Install build dependencies
        run: |
          brew install \
            gtk4 libadwaita pygobject3 \
            blueprint-compiler meson ninja \
            gettext pkg-config desktop-file-utils

      # gettext is keg-only, so msgfmt (needed by the i18n.gettext module)
      # is not on PATH until we add it explicitly.
      - name: Set up environment
        run: |
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          gi_path="$(brew --prefix libadwaita)/lib/girepository-1.0:$(brew --prefix gtk4)/lib/girepository-1.0"
          echo "GI_TYPELIB_PATH=$gi_path" >> "$GITHUB_ENV"

      # pygobject comes from brew (pygobject3). Installing it again from pip
      # would try to compile it against cairo and can shadow the brew one.
      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages \
            httpx diskcache babel \
            "gql[aiohttp,websockets,httpx]"

      - name: Configure
        run: meson setup build --prefix="$PWD/stage"

      - name: Build
        run: meson compile -C build

      - name: Run meson tests
        run: meson test -C build --print-errorlogs

      - name: Validate gschema
        run: glib-compile-schemas --strict --dry-run data/

      - name: Smoke test - GTK4 + libadwaita load via PyGObject
        run: |
          python3 - <<'PY'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Gtk, Adw
          print("GTK", Gtk.get_major_version(), Gtk.get_minor_version(), Gtk.get_micro_version())
          print("Adwaita", Adw.get_major_version(), Adw.get_minor_version())
          PY

      # Registers the freshly built gresource first, mirroring src/kaori.in,
      # then imports the app package (top-level imports only, no window).
      - name: Smoke test - import the Kaori package
        run: |
          mkdir -p smoke
          ln -sfn "$PWD/src" smoke/kaori
          PYTHONPATH="$PWD/smoke" python3 - <<'PY'
          import os
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Gio

          resource = os.path.join("build", "src", "kaori.gresource")
          if os.path.exists(resource):
              Gio.Resource.load(resource)._register()
              print("registered", resource)
          else:
              print("warning: gresource not found at", resource)

          import kaori.main  # noqa: F401
          print("imported kaori.main")
          PY

      - name: Install into staging prefix
        run: meson install -C build

      - name: Package staging tree
        run: tar -C stage -czf kaori-macos-${{ github.sha }}.tar.gz .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaori-macos-${{ github.sha }}
          path: kaori-macos-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload meson logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs
          path: build/meson-logs/
          retention-days: 7